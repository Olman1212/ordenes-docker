{% extends "ordenes/base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="tarjeta">
  <h1>{{ titulo }}</h1>
  <p>{{ texto }}</p>
  <p>Esta acción no se puede deshacer.</p>
  <form method="post" class="acciones">
    {% csrf_token %}
    <button class="btn peligro" type="submit">Sí, eliminar</button>
    <a class="btn sec" href="{% url volver volver_id %}">Cancelar</a>
  </form>
</div>
{% endblock %}
